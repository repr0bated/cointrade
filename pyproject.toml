[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cointrade"
version = "0.1.0"
description = "On-chain launch research, paper trading, and live activity monitoring"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cointrade = "cointrade.cli:main"

[tool.setuptools.packages.find]
include = ["cointrade*"]

[tool.setuptools.package-data]
cointrade = ["web/*.html", "web/*.js", "web/*.css"]
